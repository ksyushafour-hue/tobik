<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой Тобик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; image-rendering: pixelated; }
  :root {
    --bg: #0f141e;
    --bg2: #161d2b;
    --card: #1d2738;
    --card2: #273347;
    --ink: #f0e8d8;
    --muted: #7a8299;
    --line: #3a475e;
    --accent: #ffb84d;
    --accent2: #ffd47a;
    --good: #7fce8b;
    --bad: #e85a5a;
    --blue: #4dd0c8;
    --shadow: #060911;
  }
  html, body { height:100%; }
  body {
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 18px;
    background: var(--bg);
    color: var(--ink);
    display:flex; justify-content:center;
    padding: 12px;
    -webkit-font-smoothing: none;
    line-height: 1.3;
  }

  .app {
    width:100%; max-width: 560px;
    background: var(--card);
    border: 4px solid var(--line);
    box-shadow: 8px 8px 0 var(--shadow), 0 0 60px rgba(255,184,77,.08);
    display:flex; flex-direction:column;
    min-height: 820px;
    position: relative;
    overflow: hidden;
  }

  .bg-layer { position:absolute; inset:0; z-index:0; pointer-events:none; }
  .bg-layer img { width:100%; height:100%; object-fit: cover; opacity:.3; }
  .bg-layer::after {
    content:''; position:absolute; inset:0;
    background: var(--card);
    opacity: .78;
  }
  .app > *:not(.bg-layer):not(.screen) { position: relative; z-index:1; }

  /* TOP BAR */
  .top {
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 16px;
    border-bottom: 3px solid var(--line);
    background: var(--bg2);
  }
  .brand { font-family: 'Press Start 2P', monospace; font-size:10px; letter-spacing:1px; line-height:1.6; color: var(--accent2); }
  .brand small { display:block; font-family:'VT323'; color: var(--muted); font-size:15px; letter-spacing:0; margin-top:3px; }
  .coins {
    display:flex; align-items:center; gap:8px;
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    background: var(--bg);
    border: 3px solid var(--line);
    padding:8px 12px;
    color: var(--accent2);
  }
  .coin-ico { width:16px; height:16px; }

  /* STAGE — теперь Тобик огромный */
  .stage {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative;
    padding: 14px 12px 8px;
    min-height: 0;
  }
  .bubble {
    position:absolute; top: 8px;
    background: var(--ink);
    color: var(--bg);
    padding: 10px 14px;
    font-family:'VT323', monospace;
    font-size: 20px;
    opacity:0; transition: opacity .15s;
    max-width: 280px; text-align:center;
    z-index:5;
    border: 3px solid var(--bg);
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .bubble.show { opacity:1; }
  .bubble::after {
    content:''; position:absolute; bottom:-10px; left:50%;
    width:0; height:0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid var(--ink);
    transform: translateX(-50%);
  }

  /* ОГРОМНЫЙ ТОБИК */
  .toby-wrap {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    cursor:pointer; user-select:none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .1s steps(2);
    image-rendering: pixelated;
    margin: 0 auto;
  }
  .toby-wrap:active { transform: scale(.96); }
  .toby-wrap.bounce { animation: bounce .4s steps(4); }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    25% { transform: translateY(-18px); }
    50% { transform: translateY(-6px); }
    75% { transform: translateY(-12px); }
  }
  .toby-wrap img, .toby-wrap svg { width:100%; height:100%; object-fit: contain; display:block; image-rendering: pixelated; }
  .dog-name {
    margin-top: 8px;
    font-family: 'VT323'; font-size: 18px;
    color: var(--muted); text-align:center;
  }

  /* STATS */
  .stats {
    display:flex; flex-direction:column; gap:8px;
    margin: 0 16px 12px;
    padding: 12px;
    background: var(--bg);
    border: 3px solid var(--line);
  }
  .stat-row { display:flex; align-items:center; gap:10px; }
  .stat-ico { width:16px; height:16px; flex:0 0 16px; }
  .stat-track {
    flex:1; height:14px;
    background: var(--bg2);
    border: 2px solid var(--line);
    padding: 2px;
  }
  .stat-fill { height:100%; transition: width .3s steps(6); }
  .fill-hunger { background: var(--accent); }
  .fill-happy  { background: var(--blue); }
  .fill-energy { background: var(--good); }

  /* DOCK */
  .dock {
    display:grid; grid-template-columns: repeat(4, 1fr);
    border-top: 3px solid var(--line);
    background: var(--bg2);
  }
  .dock button {
    all: unset;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; padding: 14px 4px;
    color: var(--muted);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; letter-spacing:.5px;
    transition: background .1s;
    border-right: 2px solid var(--line);
  }
  .dock button:last-child { border-right: none; }
  .dock button:hover:not(:disabled) { background: var(--card2); color: var(--accent); }
  .dock button:disabled { opacity:.3; cursor:not-allowed; }
  .dock button svg { width:28px; height:28px; }

  /* ===== FULLSCREEN SCREENS ===== */
  .screen {
    position:fixed; inset:0;
    background: var(--bg);
    padding: 16px;
    display:none; flex-direction:column;
    z-index: 100;
    overflow-y:auto;
  }
  .screen.active { display:flex; }
  .screen::-webkit-scrollbar { width:8px; }
  .screen::-webkit-scrollbar-track { background: var(--bg2); }
  .screen::-webkit-scrollbar-thumb { background: var(--line); }
  .screen-inner {
    width:100%; max-width: 560px; margin: 0 auto;
    display:flex; flex-direction:column; flex:1;
  }
  .screen-head {
    display:flex; align-items:center; gap:10px; margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 3px solid var(--line);
  }
  .back-btn {
    all:unset; cursor:pointer;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    background: var(--card2);
    border: 3px solid var(--line);
    box-shadow: 3px 3px 0 var(--shadow);
    color: var(--ink);
  }
  .back-btn:hover { background: var(--accent); color: var(--bg); }
  .back-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .back-btn svg { width:18px; height:18px; }
  .screen-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px; letter-spacing:1px;
    color: var(--accent2);
  }

  .menu-list { display:flex; flex-direction:column; gap:12px; }
  .menu-card {
    all:unset;
    display:flex; align-items:center; gap:14px;
    padding: 16px;
    background: var(--card);
    border: 3px solid var(--line);
    box-shadow: 4px 4px 0 var(--shadow);
    cursor:pointer; text-align:left;
    transition: transform .1s;
    box-sizing:border-box; width:100%;
  }
  .menu-card:hover { background: var(--card2); border-color: var(--accent); }
  .menu-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
  .menu-card .mc-ico {
    width:48px; height:48px; flex:0 0 48px;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg);
    border: 2px solid var(--line);
  }
  .menu-card .mc-ico svg { width:26px; height:26px; }
  .menu-card h4 {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px; line-height:1.6; letter-spacing:.5px;
    color: var(--ink);
  }
  .menu-card p { font-family:'VT323'; font-size: 17px; color: var(--muted); margin-top:4px; }

  /* ACHIEVEMENTS */
  .ach-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
  .ach-item {
    background: var(--card);
    border: 3px solid var(--line);
    padding: 14px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center; opacity:.3; transition: all .2s;
  }
  .ach-item.unlocked {
    opacity:1; border-color: var(--accent2);
    background: var(--card2);
    box-shadow: 3px 3px 0 rgba(255,212,122,.2);
  }
  .ach-item svg { width:28px; height:28px; }
  .ach-item span { font-family:'VT323'; font-size: 16px; line-height:1.2; color: var(--ink); }

  /* MINIGAME */
  .mg-content { flex:1; display:flex; flex-direction:column; min-height:0; }
  .mg-info { font-family:'VT323'; font-size: 19px; color: var(--muted); margin-bottom:14px; }

  /* ОГРОМНОЕ ПОЛЕ ДЛЯ МЫШЕЙ */
  .mole-area {
    flex:1;
    min-height: 480px;
    background: var(--bg2);
    border: 3px solid var(--line);
    position:relative; overflow:hidden;
    background-image:
      linear-gradient(rgba(58,71,94,.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,71,94,.25) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* ОГРОМНАЯ МЫШЬ */
  .mole {
    position:absolute;
    width: 120px; height: 120px;
    cursor:pointer; user-select:none;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(4px 4px 0 rgba(0,0,0,.6));
    transition: transform .08s steps(2);
  }
  .mole:active { transform: scale(.9); }
  .mole img, .mole svg { width:100%; height:100%; object-fit: contain; display:block; image-rendering: pixelated; }

  .ttt-grid {
    display:grid; grid-template-columns: repeat(3,1fr); gap:8px;
    margin: 8px 0 16px;
  }
  .ttt-cell {
    aspect-ratio:1;
    background: var(--card);
    border: 3px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Press Start 2P', monospace;
    font-size:28px;
    cursor:pointer;
    color: var(--ink);
    transition: background .1s;
  }
  .ttt-cell:hover { background: var(--card2); }
  .ttt-cell.x { color: var(--accent); }
  .ttt-cell.o { color: var(--blue); }

  .quiz-q {
    font-family:'VT323'; font-size: 22px;
    margin-bottom:16px; line-height:1.5;
    color: var(--ink);
    background: var(--bg2);
    padding: 16px;
    border-left: 5px solid var(--accent);
  }
  .quiz-opt {
    all:unset; display:block; width:100%; box-sizing:border-box;
    padding:14px 16px;
    background: var(--card);
    border: 3px solid var(--line);
    margin-bottom:10px; cursor:pointer;
    font-family:'VT323'; font-size: 20px;
    color: var(--ink);
    transition: all .1s;
  }
  .quiz-opt:hover { background: var(--card2); border-color: var(--accent); }
  .quiz-opt:active { transform: translate(2px,2px); }
  .quiz-opt.correct { border-color: var(--good); background: rgba(127,206,139,.15); }
  .quiz-opt.wrong { border-color: var(--bad); background: rgba(232,90,90,.15); opacity:.6; }

  /* FOCUS */
  .focus-wrap {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; gap:8px;
  }
  .focus-timer {
    font-family: 'Press Start 2P', monospace;
    font-size: 44px;
    color: var(--accent2);
    letter-spacing:2px;
    font-variant-numeric: tabular-nums;
    text-shadow: 4px 4px 0 var(--shadow);
  }
  .focus-label { font-family:'VT323'; font-size: 19px; color: var(--muted); margin-bottom: 24px; }
  .focus-presets { display:flex; gap:8px; margin-bottom:24px; }
  .focus-presets button {
    all:unset;
    padding:10px 14px;
    background: var(--card);
    border: 3px solid var(--line);
    font-family:'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--muted);
    cursor:pointer;
  }
  .focus-presets button:hover { color: var(--ink); }
  .focus-presets button.active {
    background: var(--accent); color: var(--bg); border-color: var(--accent2);
  }
  .focus-start {
    all:unset;
    padding: 18px 44px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    cursor:pointer;
    border: 3px solid var(--accent2);
    box-shadow: 4px 4px 0 var(--shadow);
    transition: transform .1s;
  }
  .focus-start:hover { background: var(--accent2); }
  .focus-start:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--shadow); }
  .focus-start.stop { background: var(--ink); color: var(--bg); border-color: var(--muted); }
  .focus-hint { font-family:'VT323'; font-size: 18px; color: var(--muted); margin-top: 20px; line-height:1.5; max-width: 300px; }

  /* LORE */
  .lore-card {
    background: var(--card);
    border: 3px solid var(--line);
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .lore-card h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px; line-height:1.6;
    color: var(--accent2);
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 4px solid var(--accent);
  }
  .lore-card p { font-family:'VT323'; font-size: 20px; line-height: 1.6; color: #cfc8bb; }
  .lore-empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-family:'VT323'; font-size: 20px;
    line-height:1.6;
  }
  .lore-empty svg { width:80px; height:80px; opacity:.3; margin-bottom:16px; }
  .lore-count {
    display: inline-block;
    background: var(--bg2);
    color: var(--accent2);
    padding: 8px 14px;
    border: 2px solid var(--line);
    font-family:'Press Start 2P', monospace;
    font-size: 9px;
    margin-bottom: 14px;
  }

  /* TOAST */
  .toast {
    position:fixed; bottom:20px; left:50%;
    transform: translate(-50%, 80px);
    background: var(--accent);
    color: var(--bg);
    padding: 14px 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    line-height:1.7;
    border: 3px solid var(--accent2);
    box-shadow: 4px 4px 0 var(--shadow);
    opacity:0; transition: all .3s steps(3); pointer-events:none;
    z-index: 200; white-space:nowrap;
    max-width: 92vw; overflow:hidden; text-overflow: ellipsis;
    text-align:center;
  }
  .toast.show { opacity:1; transform: translate(-50%, 0); }

  .pixel-btn {
    all:unset;
    display:inline-block;
    padding: 14px 28px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor:pointer;
    border: 3px solid var(--accent2);
    box-shadow: 3px 3px 0 var(--shadow);
    text-align:center;
  }
  .pixel-btn:hover { background: var(--accent2); }
  .pixel-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--shadow); }
</style>
</head>
<body>
<div class="app">

  <div class="bg-layer">
    <img src="bg.png" alt=""
      onerror="this.style.display='none';this.parentElement.style.background='#1d2738'">
  </div>

  <div class="top">
    <div class="brand">ТОБИК<small>друг Артурито</small></div>
    <div class="coins">
      <svg class="coin-ico" viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="1" y="1" width="6" height="6" fill="#ffd47a"/>
        <rect x="2" y="2" width="4" height="4" fill="#ffb84d"/>
        <rect x="3" y="3" width="2" height="2" fill="#1d2738"/>
      </svg>
      <span id="coins">0</span>
    </div>
  </div>

  <div class="stage">
    <div class="bubble" id="bubble">Гав!</div>
    <div class="toby-wrap" id="toby">
      <img src="toby.png" alt="Тобик"
        onerror="this.outerHTML='&lt;svg viewBox=\'0 0 32 32\' shape-rendering=\'crispEdges\' xmlns=\'http://www.w3.org/2000/svg\'&gt;&lt;g fill=\'#a06b3e\'&gt;&lt;rect x=\'6\' y=\'4\' width=\'3\' height=\'3\'/&gt;&lt;rect x=\'23\' y=\'4\' width=\'3\' height=\'3\'/&gt;&lt;rect x=\'6\' y=\'7\' width=\'4\' height=\'4\'/&gt;&lt;rect x=\'22\' y=\'7\' width=\'4\' height=\'4\'/&gt;&lt;rect x=\'4\' y=\'8\' width=\'3\' height=\'5\'/&gt;&lt;rect x=\'25\' y=\'8\' width=\'3\' height=\'5\'/&gt;&lt;rect x=\'5\' y=\'11\' width=\'2\' height=\'3\'/&gt;&lt;rect x=\'25\' y=\'11\' width=\'2\' height=\'3\'/&gt;&lt;/g&gt;&lt;g fill=\'#c98a52\'&gt;&lt;rect x=\'9\' y=\'8\' width=\'14\' height=\'3\'/&gt;&lt;rect x=\'7\' y=\'11\' width=\'18\' height=\'12\'/&gt;&lt;rect x=\'9\' y=\'23\' width=\'14\' height=\'2\'/&gt;&lt;/g&gt;&lt;g fill=\'#d69a60\'&gt;&lt;rect x=\'8\' y=\'12\' width=\'2\' height=\'3\'/&gt;&lt;rect x=\'22\' y=\'12\' width=\'2\' height=\'3\'/&gt;&lt;/g&gt;&lt;g fill=\'#8a5a30\'&gt;&lt;rect x=\'10\' y=\'10\' width=\'3\' height=\'2\'/&gt;&lt;rect x=\'19\' y=\'10\' width=\'3\' height=\'2\'/&gt;&lt;/g&gt;&lt;g fill=\'#1d2738\'&gt;&lt;rect x=\'10\' y=\'13\' width=\'3\' height=\'3\'/&gt;&lt;rect x=\'19\' y=\'13\' width=\'3\' height=\'3\'/&gt;&lt;/g&gt;&lt;g fill=\'#ffffff\'&gt;&lt;rect x=\'11\' y=\'13\' width=\'1\' height=\'1\'/&gt;&lt;rect x=\'20\' y=\'13\' width=\'1\' height=\'1\'/&gt;&lt;/g&gt;&lt;g fill=\'#f0ddc2\'&gt;&lt;rect x=\'11\' y=\'19\' width=\'10\' height=\'6\'/&gt;&lt;rect x=\'13\' y=\'18\' width=\'6\' height=\'1\'/&gt;&lt;/g&gt;&lt;g fill=\'#1d2738\'&gt;&lt;rect x=\'14\' y=\'18\' width=\'4\' height=\'2\'/&gt;&lt;rect x=\'15\' y=\'18\' width=\'1\' height=\'1\'/&gt;&lt;/g&gt;&lt;rect x=\'12\' y=\'22\' width=\'8\' height=\'1\' fill=\'#1d2738\'/&gt;&lt;rect x=\'12\' y=\'23\' width=\'1\' height=\'1\' fill=\'#1d2738\'/&gt;&lt;rect x=\'19\' y=\'23\' width=\'1\' height=\'1\' fill=\'#1d2738\'/&gt;&lt;rect x=\'14\' y=\'23\' width=\'4\' height=\'2\' fill=\'#e07a7a\'/&gt;&lt;rect x=\'15\' y=\'25\' width=\'2\' height=\'1\' fill=\'#c96b6b\'/&gt;&lt;/svg&gt;'">
    </div>
    <div class="dog-name" id="dogName">нажми на Тобика</div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <svg class="stat-ico" viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="1" y="3" width="6" height="2" fill="#ffb84d"/>
        <rect x="0" y="4" width="1" height="2" fill="#ffb84d"/>
        <rect x="7" y="4" width="1" height="2" fill="#ffb84d"/>
      </svg>
      <div class="stat-track"><div class="stat-fill fill-hunger" id="barHunger"></div></div>
    </div>
    <div class="stat-row">
      <svg class="stat-ico" viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="1" y="2" width="6" height="4" fill="#4dd0c8"/>
        <rect x="2" y="6" width="4" height="1" fill="#4dd0c8"/>
        <rect x="2" y="3" width="1" height="1" fill="#0f141e"/>
        <rect x="5" y="3" width="1" height="1" fill="#0f141e"/>
      </svg>
      <div class="stat-track"><div class="stat-fill fill-happy" id="barHappy"></div></div>
    </div>
    <div class="stat-row">
      <svg class="stat-ico" viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="4" y="1" width="2" height="2" fill="#7fce8b"/>
        <rect x="3" y="3" width="2" height="2" fill="#7fce8b"/>
        <rect x="2" y="5" width="3" height="2" fill="#7fce8b"/>
      </svg>
      <div class="stat-track"><div class="stat-fill fill-energy" id="barEnergy"></div></div>
    </div>
  </div>

  <div class="dock">
    <button id="btnFeed">
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="2" y="2" width="4" height="4" fill="currentColor"/>
        <rect x="3" y="1" width="2" height="1" fill="currentColor"/>
        <rect x="3" y="6" width="2" height="1" fill="currentColor"/>
      </svg>КОРМ
    </button>
    <button id="btnPlay">
      <svg viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect x="1" y="1" width="2" height="2" fill="currentColor"/>
        <rect x="5" y="1" width="2" height="2" fill="currentColor"/>
        <rect x="1" y="5" width="2" height="2" fill="currentColor"/>
        <rect x="5" y="5" width="2" height="2" fill="currentColor"/>
        <rect x="3" y="3" width="2" height="2" fill="currentColor"/>
      </svg>ИГРА
    </button>
    <button id="btnSleep">

<script>
const state = {
  coins: 0, hunger: 70, happy: 70, energy: 80,
  totalPets: 0, totalFeeds: 0,
  miceCaught: 0, ticWins: 0, quizWins: 0, quizTotal: 0, focusSessions: 0,
  achievements: new Set(),
  unlockedLore: new Set(),
};

const ACHIEVEMENTS = [
  { id:'first_pet', name:'ПЕРВЫЙ КОНТАКТ', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="1" y="2" width="6" height="4" fill="#ffb84d"/><rect x="2" y="3" width="1" height="1" fill="#0f141e"/><rect x="5" y="3" width="1" height="1" fill="#0f141e"/><rect x="3" y="5" width="2" height="1" fill="#0f141e"/></svg>' },
  { id:'first_feed', name:'КОРМИЛЕЦ', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="2" y="2" width="4" height="4" fill="#ffb84d"/></svg>' },
  { id:'pet_10', name:'ЛУЧШИЙ ДРУГ', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="1" y="2" width="2" height="2" fill="#e85a5a"/><rect x="5" y="2" width="2" height="2" fill="#e85a5a"/><rect x="3" y="4" width="2" height="2" fill="#e85a5a"/></svg>' },
  { id:'rich', name:'БОГАЧ', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="2" y="2" width="4" height="4" fill="#ffd47a"/><rect x="3" y="3" width="2" height="2" fill="#0f141e"/></svg>' },
  { id:'mouse_5', name:'ГРОЗА МЫШЕЙ', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="2" y="3" width="4" height="3" fill="#8a5c3f"/><rect x="3" y="4" width="1" height="1" fill="#0f141e"/><rect x="4" y="4" width="1" height="1" fill="#0f141e"/></svg>' },
  { id:'tic_win', name:'СТРАТЕГ', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="1" y="1" width="2" height="2" fill="#4dd0c8"/><rect x="5" y="5" width="2" height="2" fill="#4dd0c8"/></svg>' },
  { id:'quiz_win', name:'ЗНАТОК ЛОРА', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="3" y="1" width="2" height="6" fill="#7fce8b"/><rect x="1" y="3" width="6" height="2" fill="#7fce8b"/></svg>' },
  { id:'focus', name:'ПОМОЩНИК АРТУРИТО', ico:'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="2" y="2" width="4" height="4" fill="none" stroke="#ffb84d" stroke-width="1"/><rect x="4" y="3" width="1" height="2" fill="#ffb84d"/></svg>' },
];

const LORE = [
  { id:'lore_intro', title:'КТО ТАКОЙ ТОБИК',
    text:'Тобик — не просто собака. Это маленький хранитель фокуса, который живёт на рабочем столе Артурито и следит, чтобы тот не отвлекался от подготовки к экзамену. Говорят, он появился из первого коммита, который никто не смог откатить.' },
  { id:'lore_mice', title:'МЫШИ',
    text:'Мыши — древние спутники программистов. Когда-то они были просто грызунами, а теперь сидят у каждого на столе. Тобик их уважает, но иногда ловит — это игра. Каждая пойманная мышь делает его чуть мудрее.' },
  { id:'lore_gregory', title:'ВЕЛИКИЙ МУДРЕЦ ГРЕГОРИ',
    text:'Говорят, Грегори учил писать код ещё до появления компьютеров — на глиняных табличках. Первая его программа была «Hello, World» на языке, который уже никто не помнит. Тобик считает его своим духовным наставником.' },
  { id:'lore_aul', title:'АУЛ В АРМЕНИИ',
    text:'Там, по легенде, Грегори основал первую школу программирования под открытым небом. Ученики писали алгоритмы палочками на песке, а Тобик сторожил их от отвлечений. Ни один баг не прошёл мимо его носа.' },
  { id:'lore_mark', title:'ПРО МАРКА',
    text:'Марк — легендарный персонаж местного фольклора. Тобик предпочитает о нём не распространяться. Скажем так: Марк однажды забыл сохранить код перед закрытием редактора. С тех пор его имя в этих краях произносят шёпотом.' },
  { id:'lore_arturito', title:'АРТУРИТО',
    text:'Артурито готовится к рабочему экзамену. Тобик — его личный таймер фокуса: сидит рядом, не отвлекает, а когда Артурито закончит — радостно виляет хвостом. Вместе они — непобедимая команда.' },
  { id:'lore_focus', title:'СЕКРЕТ ФОКУСА',
    text:'Тобик знает секрет: 25 минут работы + 5 минут отдыха = прогресс. Он не даёт Артурито отвлекаться на телефоне, потому что верит: каждый помидор (Pomodoro) приближает к победе.' },
  { id:'lore_final', title:'ФИЛОСОФИЯ ТОБИКА',
    text:'«Не важно, сколько ты написал кода. Важно, сколько ты не забыл сохранить». — Тобик, вероятно. Эта мудрость передаётся из поколения в поколение программистов.' },
];

const QUIZ = [
  { q:'Кто такой Тобик?', a:['Собака-хранитель фокуса','Кот','Робот'], c:0 },
  { q:'Где, по легенде, учил Грегори?', a:['В ауле в Армении','В GitHub','В облаке'], c:0 },
  { q:'Кто такой Марк?', a:['Забыл сохранить код','Друг Тобика','Программист'], c:0 },
  { q:'Что ловит Тобик в мини-игре?', a:['Мышей','Мух','Баги'], c:0 },
  { q:'Сколько минут в одной сессии фокуса?', a:['25','10','60'], c:0 },
  { q:'Кто готовится к рабочему экзамену?', a:['Артурито','Марк','Грегори'], c:0 },
  { q:'Что написал Грегори в первой программе?', a:['Hello, World','print(1)','Nothing'], c:0 },
  { q:'Что нельзя забыть перед закрытием редактора?', a:['Сохранить код','Покормить Тобика','Выключить свет'], c:0 },
  { q:'Кто такой Великий Мудрец Грегори?', a:['Наставник Тобика','Сосед','Кот'], c:0 },
  { q:'Что делает Тобик, когда Артурито закончил?', a:['Виляет хвостом','Лает','Спит'], c:0 },
];

const $ = id => document.getElementById(id);
const toby = $('toby');
const bubble = $('bubble');
const toastEl = $('toast');
const clamp = (v,m=0,M=100) => Math.max(m, Math.min(M, v));

function say(text) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(say._t);
  say._t = setTimeout(() => bubble.classList.remove('show'), 2000);
}
function bounce() {
  toby.classList.remove('bounce');
  void toby.offsetWidth;
  toby.classList.add('bounce');
}
function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function unlockLore(id) {
  if (state.unlockedLore.has(id)) return;
  state.unlockedLore.add(id);
  const lore = LORE.find(l => l.id === id);
  if (lore) toast('📖 ' + lore.title);
  renderLore();
}

function renderLore() {
  const list = $('loreList');
  const count = $('loreCount');
  const badge = $('loreBadge');
  const unlocked = state.unlockedLore.size;
  count.textContent = `${unlocked} записок`;
  badge.textContent = `${unlocked} ИЗ ${LORE.length}`;

  if (unlocked === 0) {
    list.innerHTML = `<div class="lore-empty">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="3" y="2" width="10" height="12" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="5" y="5" width="6" height="1" fill="currentColor"/>
        <rect x="5" y="7" width="4" height="1" fill="currentColor"/>
        <rect x="5" y="9" width="5" height="1" fill="currentColor"/>
      </svg>
      <div>Пока пусто. Играй, ухаживай за Тобиком, и записки будут открываться сами.</div>
    </div>`;
    return;
  }

  list.innerHTML = '';
  LORE.forEach(l => {
    if (!state.unlockedLore.has(l.id)) return;
    const card = document.createElement('div');
    card.className = 'lore-card';
    card.innerHTML = `<h3>${l.title}</h3><p>${l.text}</p>`;
    list.appendChild(card);
  });
}

function render() {
  $('coins').textContent = state.coins;
  $('barHunger').style.width = state.hunger + '%';
  $('barHappy').style.width  = state.happy + '%';
  $('barEnergy').style.width = state.energy + '%';
  $('btnSleep').disabled = state.energy >= 100;
  $('btnFeed').disabled = state.hunger >= 100;
  $('achCount').textContent = `${state.achievements.size} / ${ACHIEVEMENTS.length}`;
  renderLore();
}
function renderAch() {
  const g = $('achGrid');
  g.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const d = document.createElement('div');
    d.className = 'ach-item' + (state.achievements.has(a.id) ? ' unlocked' : '');
    d.innerHTML = a.ico + `<span>${a.name}</span>`;
    g.appendChild(d);
  });
}
function unlock(id) {
  if (state.achievements.has(id)) return;
  state.achievements.add(id);
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (a) toast('🏆 ' + a.name);
  renderAch(); render();
}
function checkAch() {
  if (state.totalPets >= 1) unlock('first_pet');
  if (state.totalFeeds >= 1) unlock('first_feed');
  if (state.totalPets >= 10) unlock('pet_10');
  if (state.coins >= 100) unlock('rich');
  if (state.miceCaught >= 5) unlock('mouse_5');
  if (state.ticWins >= 1) unlock('tic_win');
  if (state.quizWins >= 3) unlock('quiz_win');
  if (state.focusSessions >= 1) unlock('focus');
}

$('btnFeed').onclick = () => {
  if (state.hunger >= 100) return;
  state.hunger = clamp(state.hunger + 25);
  state.happy = clamp(state.happy + 5);
  state.totalFeeds++;
  say('Ням-ням!'); bounce(); render(); checkAch();
  unlockLore('lore_intro');
};
$('btnPlay').onclick = () => {
  if (state.energy < 10) { say('Устал...'); return; }
  state.happy = clamp(state.happy + 18);
  state.energy = clamp(state.energy - 12);
  state.hunger = clamp(state.hunger - 5);
  state.coins += 2;
  say('Ура!'); bounce(); render(); checkAch();
  unlockLore('lore_focus');
};
$('btnSleep').onclick = () => {
  state.energy = clamp(state.energy + 30);
  state.hunger = clamp(state.hunger - 5);
  say('Хрр...'); render(); checkAch();
  unlockLore('lore_final');
};
toby.onclick = () => {
  state.happy = clamp(state.happy + 8);
  state.totalPets++;
  const phrases = ['Гав!', 'Ты лучший!', 'Вуф!', 'Ещё погладь!', 'Тобик рад'];
  say(phrases[Math.floor(Math.random()*phrases.length)]);
  bounce(); render(); checkAch();
  unlockLore('lore_mice');
};

document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openScreen(b.dataset.open));
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.screen').classList.remove('active'));
$('btnMenu').onclick = () => openScreen('menu');

function openScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const s = $('screen-' + name);
  if (s) s.classList.add('active');
  if (name === 'quiz') startQuiz();
  if (name === 'ttt') initTtt();
  if (name === 'mole') startMole();
  if (name === 'lore') renderLore();
  if (name === 'ach') renderAch();
}

let focusMin = 25, focusInterval = null, focusLeft = 25*60;
const focusTimerEl = $('focusTimer');
const focusBtn = $('focusStart');

document.querySelectorAll('.focus-presets button').forEach(b => {
  b.onclick = () => {
    if (focusInterval) return;
    document.querySelectorAll('.focus-presets button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    focusMin = +b.dataset.min;
    focusLeft = focusMin * 60;
    updateFocusDisplay();
  };
});
function updateFocusDisplay() {
  const m = Math.floor(focusLeft / 60), s = focusLeft % 60;
  focusTimerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
focusBtn.onclick = () => {
  if (focusInterval) {
    clearInterval(focusInterval); focusInterval = null;
    focusBtn.textContent = 'НАЧАТЬ'; focusBtn.classList.remove('stop');
    focusLeft = focusMin * 60; updateFocusDisplay(); return;
  }
  focusBtn.textContent = 'СТОП'; focusBtn.classList.add('stop');
  focusInterval = setInterval(() => {
    focusLeft--; updateFocusDisplay();
    if (focusLeft <= 0) {
      clearInterval(focusInterval); focusInterval = null;
      focusBtn.textContent = 'НАЧАТЬ'; focusBtn.classList.remove('stop');
      state.focusSessions++; state.coins += 20;
      state.happy = clamp(state.happy + 10);
      toast('✅ СЕССИЯ +20');
      render(); checkAch();
      unlockLore('lore_arturito');
      if (state.focusSessions >= 2) unlockLore('lore_gregory');
      focusLeft = focusMin * 60; updateFocusDisplay();
    }
  }, 1000);
};
updateFocusDisplay();

let moleInterval = null;
function startMole() {
  const area = $('moleArea');
  const info = $('moleInfo');
  area.innerHTML = '';
  if (moleInterval) clearInterval(moleInterval);

  let caught = 0, timeLeft = 10;
  info.textContent = `Осталось: ${timeLeft} · Поймано: 0`;

  const tick = setInterval(() => {
    timeLeft--;
    info.textContent = `Осталось: ${timeLeft} · Поймано: ${caught}`;
    if (timeLeft <= 0) {
      clearInterval(tick); clearInterval(moleInterval);
      state.coins += caught; state.miceCaught += caught;
      info.textContent = `Готово! Поймано: ${caught} → +${caught}`;
      render(); checkAch();
      unlockLore('lore_mice');
      if (caught >= 5) unlockLore('lore_focus');
    }
  }, 1000);

  moleInterval = setInterval(() => {
    if (timeLeft <= 0) return;
    const m = document.createElement('div');
    m.className = 'mole';
    const img = new Image();
    img.src = 'mouse.png';
    img.onerror = () => { m.innerHTML = MOLE_FALLBACK; };
    m.appendChild(img);
    m.style.left = (Math.random() * Math.max(0, area.clientWidth - 120)) + 'px';
    m.style.top  = (Math.random() * Math.max(0, area.clientHeight - 120)) + 'px';
    m.onclick = e => { e.stopPropagation(); caught++; m.remove(); };
    area.appendChild(m);
    setTimeout(() => m.remove(), 800);
  }, 400);
}

function initTtt() {
  const grid = $('tttGrid');
  const info = $('tttInfo');
  let board = Array(9).fill('');
  let over = false;
  info.textContent = 'Ты — X. Тобик — O';
  function draw() {
    grid.innerHTML = '';
    board.forEach((v, i) => {
      const c = document.createElement('div');
      c.className = 'ttt-cell' + (v === 'X' ? ' x' : v === 'O' ? ' o' : '');
      c.textContent = v;
      c.onclick = () => move(i);
      grid.appendChild(c);
    });
  }
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(b) {
    for (const w of wins) if (b[w[0]] && b[w[0]]===b[w[1]] && b[w[1]]===b[w[2]]) return b[w[0]];
    return b.includes('') ? null : 'draw';
  }
  function move(i) {
    if (over || board[i]) return;
    board[i] = 'X';
    let w = winner(board);
    if (w) return finish(w);
    const empty = board.map((v,i)=>v?null:i).filter(x=>x!==null);
    board[empty[Math.floor(Math.random()*empty.length)]] = 'O';
    w = winner(board);
    if (w) return finish(w);
    draw();
  }
  function finish(w) {
    over = true; draw();
    if (w === 'X') { info.textContent = 'ПОБЕДА! +10'; state.coins += 10; state.ticWins++; unlockLore('lore_mark'); }
    else if (w === 'O') info.textContent = 'Тобик выиграл';
    else info.textContent = 'Ничья';
    render(); checkAch();
  }
  draw();
}
$('tttReset').onclick = initTtt;

let quizIdx = 0, quizCorrect = 0, quizOrder = [];
function startQuiz() {
  quizOrder = [...QUIZ].sort(() => Math.random() - 0.5).slice(0, 5);
  quizIdx = 0; quizCorrect = 0;
  renderQuiz();
}
function renderQuiz() {
  if (quizIdx >= quizOrder.length) {
    $('quizQ').textContent = `РЕЗУЛЬТАТ: ${quizCorrect} / ${quizOrder.length}`;
    $('quizOpts').innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'pixel-btn';
    btn.textContent = 'ЕЩЁ РАЗ';
    btn.style.marginTop = '20px';
    btn.onclick = startQuiz;
    $('quizOpts').appendChild(btn);
    $('quizScore').textContent = `Счёт: ${quizCorrect} / ${quizOrder.length}`;
    if (quizCorrect >= 3) { state.quizWins++; state.coins += 15; unlockLore('lore_gregory'); }
    if (quizCorrect >= 4) unlockLore('lore_aul');
    if (quizCorrect === quizOrder.length) unlockLore('lore_arturito');
    render(); checkAch();
    return;
  }
  const task = quizOrder[quizIdx];
  $('quizQ').textContent = task.q;
  $('quizScore').textContent = `Счёт: ${quizCorrect} / ${quizIdx}`;
  const opts = task.a.map((t,i) => ({t, ok: i === task.c})).sort(() => Math.random() - 0.5);
  const box = $('quizOpts');
  box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'quiz-opt'; b.textContent = o.t;
    b.onclick = () => {
      if (o.ok) { b.classList.add('correct'); quizCorrect++; }
      else {
        b.classList.add('wrong');
        opts.forEach((x,xi) => { if (x.ok) box.children[xi].classList.add('correct'); });
      }
      Array.from(box.children).forEach(c => c.onclick = null);
      setTimeout(() => { quizIdx++; renderQuiz(); }, 800);
    };
    box.appendChild(b);
  });
}

  if (state.energy < 100) state.energy = clamp(state.energy + 0.5);
